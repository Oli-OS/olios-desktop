[Unit]
Requires=seatd.service
After=seatd.service

[Service]
DevicePolicy=closed
DeviceAllow=/dev/tty2 rw
DeviceAllow=/dev/dri/card1 rw
DeviceAllow=/dev/dri/renderD128 rw
ExecStartPre=/usr/bin/setfacl -m u:_greetd:rw /dev/dri/card1 /dev/dri/renderD128
ExecStopPost=-/usr/bin/setfacl -x u:_greetd /dev/dri/card1 /dev/dri/renderD128